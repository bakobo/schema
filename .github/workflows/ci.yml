name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "tools/py/uv.lock"
      - name: Install dependencies (frozen)
        run: uv sync --frozen
      - name: Check pinned Sam Smith SEDI schema SAIDs and bytes
        run: uv run pytest -o addopts= tests/conformance/test_sedi_pins.py
      - name: Run tests (pytest + 100% branch coverage gate)
        run: uv run pytest
